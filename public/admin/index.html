<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, #f0f4ff, #e8f5ff 40%, #ffffff 80%);
      color: #1b1f3a;
    }
    .card {
      padding: 2.5rem 3rem;
      border-radius: 16px;
      background: #ffffffee;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 480px;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.8rem;
      letter-spacing: 0.02em;
    }
    p {
      margin: 0;
      color: #4c5672;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Admin ログイン完了</h1>
    <p>管理エリアにアクセスできる状態です。</p>
  </div>
</body>
</html>
